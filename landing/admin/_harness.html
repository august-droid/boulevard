<style>

 --card:#15151a; --card-2:#1c1c22;
 --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
 --gold:#c8ae7a; --gold-hi:#e3cb98; --gold-deep:#a48a5c;
 --accent:#c8ae7a; --good:#10b981; --bad:#ef4444; --warn:#f59e0b;
 }
 * { box-sizing:border-box; }
 body { margin:0; font:14px/1.5 "Inter",-apple-system,sans-serif; background:var(--bg); color:var(--fg); }
 .empty { padding:60px; text-align:center; color:var(--muted); font-size:18px; font-style:italic; }
 .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
 .modal { background:var(--card); border:1px solid var(--border-strong); border-radius:16px; width:100%; max-width:560px; box-shadow:0 30px 60px rgba(0,0,0,0.5); max-height:90vh; display:flex; flex-direction:column; }
 .modal .head { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
 .modal .head h2 { margin:0; font-size:20px; font-weight:600; }
 .modal .head .close { margin-left:auto; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:22px; padding:4px 10px; }
 .modal .body { padding:18px 22px; overflow:auto; }
 .toast { position:fixed; bottom:18px; right:18px; background:var(--card); border:1px solid var(--border-strong); padding:11px 16px; border-radius:10px; z-index:200; }
</style>
</head>
<body>

<script type="module">

   niche:'aesthetic', country:'AU', status:'posted', can_use_as_ad:true, can_edit_video:true },
 { id:'c6', platform:'tiktok', creator_name:'Theo Park', username:'theopark',
   followers:2200, avg_views:1500, avg_likes:90, avg_comments:6, audience_fit:50, content_quality:48,
   score:41, score_label:'skip', score_breakdown:{view_follower_ratio:12,engagement_rate:5,audience_fit:10,content_quality:7.2,cost_efficiency:6.6},
   niche:'tech', country:'US', status:'discovered' },

creators.forEach(c=>{ c.view_follower_ratio=ratio(c.avg_views,c.followers); c.engagement_rate=eng(c.avg_likes,c.avg_comments,c.avg_views); });

 { id:'k2', name:'IG Mood Drop', platform:'instagram', goal:'viral_reach', budget:3000, target_creators:6,
   utm_source:'instagram', utm_campaign:'ig_mood_drop', landing_page_url:'https://boulevardai.app/', status:'draft' },

const deals = [
 { id:'d1', campaign_id:'k1', creator_id:'c5', agreed_fee:250, num_posts:1, usage_rights:'paid_ads_allowed', usage_period:'90_days',

const outreach = [
 { id:'o1', creator_id:'c2', channel:'tiktok_dm', message:'Yo Leo, your videos fit exactly what we are looking for...', sent:true, sent_at:'2026-05-12T10:00:00Z', response_status:'none', created_at:'2026-05-12T10:00:00Z' },
 { id:'o2', creator_id:'c3', channel:'tiktok_dm', message:'Hey Jess, raw collab on a music app...', sent:true, sent_at:'2026-05-11T09:00:00Z', response_status:'replied', created_at:'2026-05-11T09:00:00Z' },
];

const db = { influencer_creators:creators, influencer_campaigns:campaigns, influencer_deals:deals, influencer_outreach:outreach };
const rid = ()=> 'id-'+Math.random().toString(36).slice(2,9);

function makeClient() {
  return {
    from(table) {
      let op='select', payload=null, filters=[];
      const b = {
        select(){ op='select'; return b; },
        insert(p){ op='insert'; payload=p; return b; },
        update(p){ op='update'; payload=p; return b; },
        delete(){ op='delete'; return b; },
        eq(c,v){ filters.push([c,v]); return b; },
        order(){ return b; },
        then(res){ res(exec()); },
      };
      function recompute(t,r){
        if(t==='influencer_creators'){ r.view_follower_ratio=ratio(r.avg_views||0,r.followers||0); r.engagement_rate=eng(r.avg_likes||0,r.avg_comments||0,r.avg_views||0); }
        if(t==='influencer_deals'){ r.cost_per_signup=r.signups>0?Math.round(r.agreed_fee/r.signups*100)/100:null; r.cost_per_1k_views=r.final_views>0?Math.round(r.agreed_fee/r.final_views*1000*100)/100:null; }
      }
      function exec(){
        const rows = db[table] || (db[table]=[]);
        if(op==='select') return { data:rows.slice(), error:null };
        if(op==='insert'){ (Array.isArray(payload)?payload:[payload]).forEach(p=>{ const r={ id:rid(), created_at:new Date().toISOString(), ...p }; recompute(table,r); rows.push(r); }); return { data:null, error:null }; }
        if(op==='update'){ rows.forEach(r=>{ if(filters.every(([c,v])=>r[c]===v)){ Object.assign(r,payload); recompute(table,r); } }); return { data:null, error:null }; }
        if(op==='delete'){ db[table]=rows.filter(r=>!filters.every(([c,v])=>r[c]===v)); return { data:null, error:null }; }
        return { data:null, error:null };
      }
      return b;
    },
    storage:{ from(){ return { upload:async()=>({error:null}), createSignedUrl:async()=>({data:{signedUrl:'#'},error:null}) }; } },
  };
}

function toast(m){ const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2000); }

mountInfluencers(document.getElementById('view'), { supabase: makeClient(), toast, me:{ user:{ email:'august@magnamarketing.io' } } });
</script>
</body>
