# Boulevard landing site — Netlify config.
# Strips .html extensions and forces canonical paths, so links like
# /privacy-policy resolve cleanly without the .html suffix.

[build]
  publish = "."

# Force trailing-slash-free canonical URLs.
[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/delete-account.html"
  to = "/delete-account"
  status = 301
  force = true

# Security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
